
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Management System{% endblock %}</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}"
            defer></script>
</head>
<body>
    <header class="topbar">
        <div class="container nav">
            <a class="brand" href="{{ url_for('index') }}">
                Student Manager
            </a>
            <nav>
                <a href="{{ url_for('index') }}">Students</a>
                <a class="nav-button"
                   href="{{ url_for('add_student') }}">+ Add Student</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <section class="messages" aria-live="polite">
                    {% for category, message in messages %}
                        <div class="alert {{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </section>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <footer class="container footer">
        Student Management System | Python Flask and MySQL
    </footer>
</body>
</html>
